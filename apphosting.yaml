# Firebase App Hosting configuration for KrishiSetu (Next.js SSR)
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # Supabase
  - variable: NEXT_PUBLIC_SUPABASE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME

  # Firebase (client-side public keys)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_DATABASE_URL
    availability:
      - BUILD
      - RUNTIME

  # Sarvam AI
  - variable: SARVAM_API_KEY
    availability:
      - RUNTIME

  # Government Data (AGMARKNET)
  - variable: DATA_GOV_API_KEY
    availability:
      - RUNTIME

  # Maps
  - variable: NEXT_PUBLIC_MAP_TILE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: OSRM_BASE_URL
    availability:
      - RUNTIME

  # Firebase Admin (server-only)
  - variable: FIREBASE_PROJECT_ID
    availability:
      - RUNTIME
  - variable: FIREBASE_CLIENT_EMAIL
    availability:
      - RUNTIME
  - variable: FIREBASE_PRIVATE_KEY
    availability:
      - RUNTIME
